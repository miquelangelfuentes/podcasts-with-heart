name: Build for Windows (CI/CD)

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-windows.yml'
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Download bundled offline TTS models
        shell: pwsh
        run: |
          @'
          from core.model_downloader import ModelDownloader

          downloader = ModelDownloader()
          for model in ("kokoro_heart", "piper_lessac", "piper_amy", "piper_ryan", "piper_alan"):
              if not downloader.is_model_downloaded(model):
                  if not downloader.download_model(model):
                      raise SystemExit(f"Unable to download {model}: {downloader.last_error}")
              print(f"Verified {model}")
          '@ | python -

      - name: Run automated test suite
        run: |
          python test_features.py
          python -m unittest -v test_updater.py

      - name: Check PowerShell update helper syntax
        shell: pwsh
        run: |
          @'
          import os
          from core.update_manager import make_windows_update_script
          root = os.getcwd()
          target = os.path.join(root, "dist", "PodcastsWithHeart")
          source = os.path.join(root, "updater_source")
          os.makedirs(target, exist_ok=True)
          script = make_windows_update_script(
              source, target, os.path.join(target, "PodcastsWithHeart.exe"),
              123456, "v1.0.2", source,
          )
          with open("validate-updater.ps1", "w", encoding="utf-8-sig") as file:
              file.write(script)
          '@ | python -
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "validate-updater.ps1").Path, [ref]$tokens, [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Host $_ }
              throw "Windows updater PowerShell script has syntax errors."
          }

      - name: Build standalone Windows executable (.exe)
        run: |
          python build_exe.py

      - name: Validate Windows ZIP version and executable
        shell: pwsh
        run: |
          $archivePath = "dist/PodcastsWithHeart-v1.0.2-Windows.zip"
          if (-not (Test-Path $archivePath)) {
              throw "Missing Windows ZIP for v1.0.2."
          }
          Add-Type -AssemblyName System.IO.Compression
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $archivePath).Path)
          try {
              $names = @($archive.Entries | ForEach-Object { $_.FullName })
              if (-not ($names -contains "PodcastsWithHeart/PodcastsWithHeart.exe")) {
                  throw "Windows executable is missing from the ZIP."
              }
          } finally {
              $archive.Dispose()
          }

      - name: Upload artifact to GitHub Actions
        id: upload-artifact
        uses: actions/upload-artifact@v4
        with:
          name: PodcastsWithHeart-Windows
          path: dist/PodcastsWithHeart-*-Windows.zip
          if-no-files-found: error

      # =========================================================================
      # SIGNPATH STEP (Will be activated once SignPath Foundation approves the project)
      # =========================================================================
      # - name: Request digital signature from SignPath Foundation
      #   if: github.event_name == 'release' && env.SIGNPATH_API_TOKEN != ''
      #   uses: signpath/github-action-submit-signing-request@v3
      #   with:
      #     api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
      #     organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
      #     project-slug: 'podcasts-with-heart'
      #     signing-policy-slug: 'release-signing'
      #     github-artifact-id: ${{ steps.upload-artifact.outputs.artifact-id }}
      #     wait-for-completion: true
      #     output-artifact-directory: './dist/signed'
      #   env:
      #     SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}

      - name: Attach archive to GitHub Release (if release event)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PodcastsWithHeart-*-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      # One-time publication after tests, models and the Windows ZIP succeed.
      - name: Publish Podcasts with Heart v1.0.2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $archive = "dist/PodcastsWithHeart-v1.0.2-Windows.zip"
          if (-not (Test-Path $archive)) {
              throw "Missing Windows ZIP for v1.0.2."
          }
          gh release view v1.0.2 --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
              gh release upload v1.0.2 $archive --clobber --repo "${{ github.repository }}"
          } else {
              gh release create v1.0.2 $archive --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "Podcasts with Heart v1.0.2" --notes-file docs/RELEASE_NOTES_v1.0.2.md --latest
          }
          if ($LASTEXITCODE -ne 0) {
              throw "Could not publish release v1.0.2."
          }
