name: Build for Windows (CI/CD)

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Download bundled offline TTS models
        shell: pwsh
        run: |
          @'
          from core.model_downloader import ModelDownloader

          downloader = ModelDownloader()
          for model in ("kokoro_heart", "piper_lessac", "piper_amy", "piper_ryan", "piper_alan"):
              if not downloader.is_model_downloaded(model):
                  if not downloader.download_model(model):
                      raise SystemExit(f"Unable to download {model}: {downloader.last_error}")
              print(f"Verified {model}")
          '@ | python -

      - name: Run automated test suite
        run: |
          python test_features.py

      - name: Build standalone Windows executable (.exe)
        run: |
          python build_exe.py

      - name: Upload artifact to GitHub Actions
        id: upload-artifact
        uses: actions/upload-artifact@v4
        with:
          name: PodcastsWithHeart-Windows
          path: dist/PodcastsWithHeart-*-Windows.zip
          if-no-files-found: error

      # =========================================================================
      # SIGNPATH STEP (Will be activated once SignPath Foundation approves the project)
      # =========================================================================
      # - name: Request digital signature from SignPath Foundation
      #   if: github.event_name == 'release' && env.SIGNPATH_API_TOKEN != ''
      #   uses: signpath/github-action-submit-signing-request@v3
      #   with:
      #     api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
      #     organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
      #     project-slug: 'podcasts-with-heart'
      #     signing-policy-slug: 'release-signing'
      #     github-artifact-id: ${{ steps.upload-artifact.outputs.artifact-id }}
      #     wait-for-completion: true
      #     output-artifact-directory: './dist/signed'
      #   env:
      #     SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}

      - name: Attach archive to GitHub Release (if release event)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PodcastsWithHeart-*-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
